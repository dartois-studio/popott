# Construit et publie Popott sur GitHub Pages a chaque envoi sur main.
# Adresse resultante : https://dartois.studio/popott/
# (domaine personnalise ; dartois-studio.github.io/popott/ y redirige)
#
# C'est la seule voie de publication. Il n'y a plus de fichier construit a la
# main dans le depot : ce qui est en ligne est toujours ce qui vient d'etre
# envoye, sans etape a ne pas oublier.
#
# Deux reglages, faits une fois :
#   Settings → Pages → Source → GitHub Actions
#   Settings → Secrets and variables → Actions → SUPABASE_URL, SUPABASE_ANON_KEY
#
# Sans ces secrets, le site se construirait tres bien mais sans compte ni
# foyer partage — chaque telephone dans son coin. `npm run verif` refuse de
# passer dans ce cas plutot que de laisser la surprise pour apres.

name: Publier Popott

on:
  push:
    branches: [main]
  workflow_dispatch: # permet de relancer a la main depuis l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construire:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer
        run: npm install

      # `verif` construit et controle tout : la fusion, l'application, l'ecran
      # de connexion, puis le dossier `dist/` tel qu'il sera servi.
      - name: Construire et verifier
        run: npm run verif
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
